name: Kitchen App CI/CD

on:
  push:
    branches: [ main, student/setup-ci ]
  pull_request:
    branches: [ main ]

jobs:
  test-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install API dependencies
        working-directory: api
        run: npm install

      - name: Run tests
        working-directory: api
        run: npm test

      - name: Build Docker API image
        run: docker build -t kitchen-api:ci ./api

      - name: Build Docker Web image
        run: docker build -t kitchen-web:ci ./web-ui
